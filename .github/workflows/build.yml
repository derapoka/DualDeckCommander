name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Program (önálló exe a telepítőhöz)
        run: dotnet publish src/DualDeckCommander.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish-installer
      - name: NSIS
        run: choco install nsis --no-progress -y
      - name: Telepítő
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & "C:\Program Files (x86)\NSIS\makensis.exe" /V2 installer\DualDeckCommander.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: DualDeckCommander-telepito
          path: dist/*.exe
