Description: |-
  A Dual Deck Commander ingyenes, billentyűzetről kezelhető kétpaneles fájlkezelő a Total Commander mintájára.
  Mappaként böngészi az Xbox / Xbox 360 ISO lemezképeket és Games on Demand (GoD) formátumra alakítja őket,
  megnyitja az Amiga ADF, ADZ, DMS és HDF lemezképeket, valamint böngészi és kibontja a ZIP, RAR, 7-Zip,
  LHA és Amiga LZX archívumokat. Fülek, kedvenc mappák, sötét téma és beépített képnézegető is van benne.
