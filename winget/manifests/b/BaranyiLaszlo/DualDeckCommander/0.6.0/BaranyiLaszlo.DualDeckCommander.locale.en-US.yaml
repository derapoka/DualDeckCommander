ShortDescription: Free dual-panel file manager for emulator fans and disc images (Xbox ISO, GoD conversion, Amiga ADF/DMS/HDF, LHA/LZX).
Description: |-
  Dual Deck Commander is a free, keyboard-driven two-panel file manager in the spirit of Total Commander.
  It browses Xbox / Xbox 360 ISO images like folders and converts them to Games on Demand (GoD) format,
  opens Amiga ADF, ADZ, DMS and HDF disk images, and browses / extracts ZIP, RAR, 7-Zip, LHA and Amiga LZX archives.
  Tabs, favourite folders, dark theme and a built-in image viewer are included. The user interface is in Hungarian.
